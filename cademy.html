<!DOCTYPE html>
<html>
  <head>
    <title> Cademy </title>
    <link rel="stylesheet" href="cademy.css">
  </head>
  <body>
    <table>
      <thead>
      <tr>
        <th>column one</th>
        <th>column two</th>
        <th>column three</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>1</td>
        <td>2</td>
        <td>3</td>
      </tr>
    </tbody>
    <tfoot>
      <tr>
        <td> Summary of col1 </td>
        <td> Summary of col2 </td>
        <td> Summary of col3 </td>
      </tr>
    </tfoot>
    </table>

     <input type="checkbox" name="breakfast" value="bacon"> Bacon <br>
     <input type="checkbox" name="breakfast" value="eggs"> Eggs <br>
     <input type="checkbox" name="breakfast" value="pancakes"> Pancakes <br>

     <textarea class="comment-box" rows="10" cols="20" name="comment" placeholder="
     Ostavite Komentar"></textarea>

     <form method="post" action="youtube.html">
      Enter your name:
      <input type="text" name="yname">
      <br>
      Enter your age:
      <input type="text" name="age">
      <br>
      <input type="submit" value="Submit">
     </form>

     <input type="number" name="balance" max="20"> <br>  

     <label for="firstname"> First name:</label>
     <input type="text" name="firstname" id="firstname"><br>
     <input type="checkbox" name="vehicle" value="Bike"> I own a bike
    
     <input type="range" name="movie-rating" min="0" max="10" step="0.1">
     <input type="submit" value="Submit">

     <select name="rental-option">
      <option value="small"> Small </option>
      <option value="family"> Family </option>
      <option value="lux"> Luxury </option>
     </select>

     <form action="/flexbox.html" method="PUT">
      <input type="text" name="firstname">
      <input type="submit" value="Submit"> 
     </form>

     <input list="ide">
     <datalist id="ide">
      <option value="Visual Studio Code">
      <option value="Atom">
      <option value="Sublime Text">
     </datalist>

     <input type="radio" name="delivery_option" value="pickup">
     <input type="radio" name="delivery_option" value="delivery">

     <label for="password"> Password:</label>
     <input type="text" id="password" name="password" required>

     <form action="/flexbox.html">
      Country code:
      <input type="text" name="country_code" pattern="[A-Za-z]{3}" title="Three letter country code">
      <input type="Submit">
     </form>

     <input type="number" name="rating" min="1" max="10">


    


  </body>
</html>
