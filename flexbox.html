<!DOCTYPE html>
<html>
  <head> 
    <title> Flexbox Practice </title> 
  </head>
  <body> 
    <div class="flexbox" style=" display: flex;
    flex-wrap: nowrap;
    height: 75px;
    width: 100%;">
      <div style=" background-color: red;
      height: 75px;
      order: 1;
      flex: 1 2 250px;">  </div>
      <div style=" background-color: orange;
      height: 75px;
      order: 2;
      flex: 2 1 700px;"> main </div>
      <div style="  background-color: green;
      height: 75px;
      order: 3;
      flex: 1 1 300px;"> 75px </div>
    </div>

    <div style="display: flex;
    margin-top: 10px;"> 
      <div style="background-color: lightblue;
      width: 50px;"> item1 </div>
      <div style="background-color: lightpink;
      flex: 1;"> item2 </div>
      <div style="background-color: lightblue;
      width: 75px;"> item3 </div>
      </div>

    <div style="display: flex;
    margin-top: 10px;
    justify-content: space-between;"> 
      <div style="background-color: lightpink;"> item1 </div>
      <div style="background-color: lightpink;"> item2 </div>
      <div style="background-color: lightpink;"> item3 </div>
      <div style="background-color: lightpink;"> item4 </div>
      <div style="background-color: lightpink;"> item4 </div>
      <div style="background-color: lightpink;"> item4 </div>
      <div style="background-color: lightpink;"> item4 </div>
    </div>

    <div style="display: flex;
    height: 50px;
    border: solid;
    border-color: gray;
    margin-top: 10px;
    justify-content: space-between;
    align-items: center;"> 
    <div style="background-color: lightpink;"> item1 </div>
    <div style="background-color: lightpink;"> item2 </div>
    </div>
  </body>
</html>
