<!DOCTYPE html>
<html>
  <head> 
    <title> e-Mail Box Practice </title>
    <link rel="stylesheet" href="styles/13d.css">
  </head>

  <body>
    <div class="outside-box">
      <div class="email-section-title">
        ALL INBOXES
      </div>
      <div class="email-box">
        <div class="email-sender-pfp">
          <img class="user-pfp" src="pics/cat.jpg">
        </div>
        <div class="email-content">
        <div class="email-sender-time">
          <div class="sender-name">
            Chewy Promotions
          </div>
          <div class="time">
            4:58 PM
          </div>
        </div>
        <div class="message-title">
          Biggest sales of the year!
        </div>
        <div class="message">
          Hey there! We're writing to tell you about our...
        </div>
      </div>
      </div>

      <div class="email-box">
        <div class="email-sender-pfp">
          <img class="user-pfp" src="pics/download.jpg">
        </div>
        <div class="email-content">
        <div class="email-sender-time">
          <div class="sender-name">
            Best Buy
          </div>
          <div class="time">
            12:32 PM
          </div>
        </div>
        <div class="message-title">
          Your Best Buy eReceipt
        </div>
        <div class="message">
          Thank you for shopping at Best Buy, here is...
        </div>
      </div>
      </div>

   
      <div class="email-box">
        <div class="email-sender-pfp">
          <img class="user-pfp" src="pics/dog.jpg">
        </div>
        <div class="email-content">
        <div class="email-sender-time">
          <div class="sender-name">
            Netflix
          </div>
          <div class="time">
            9:00 AM
          </div>
        </div>
        <div class="message-title">
          Here's what's coming soon to Netflix
        </div>
        <div class="message">
          Brand new movies and shows, old favorites...
        </div>
      </div>
      </div>
    </div>

    
  </body>
</html>
