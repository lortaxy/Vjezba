<!DOCTYPE html>
<html>
  <head>
    <title> 
      Tweet sample 
    </title>
    <link rel="stylesheet" href="styles/13f.css">
  </head>
  <body>
    <div class="tweet-box">
      <div class="pfp-container">
      <img class="user-pfp" src="pics/cat.jpg">
    </div>
    <div class="tweet-content">
      <div class="userandtag">
      <div class="username"> 
        supersimple.dev
      </div>
      <div class="user-tag"> 
        @SuperSimpleDev
      </div>
    </div>
    <div class="tweet-message">
      What is backend web development? A complete overview. New video is up!
    </div>
    <div class="box">
      <div class="graybox"></div>
      <div class="textbox">
        <div class="titlebox">
          youtube.com
        </div>
        <div class="info">
          Backend web developer - a complete overview (2021)
        </div>
      </div>
    </div>
     </div>
    </div>
  </body>
</html>
