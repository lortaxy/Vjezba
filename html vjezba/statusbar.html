<!DOCTYPE html>
<html>

<head>
  <title> Twitter </title>
  <link rel="stylesheet" href="styles/statusbar.css">
</head>

<body>

  <div class="tweet-box">
    <img class="icon-pic" src="pics/download.jpg">
    <input type="text" class="text-box" placeholder="Whats happening?">
    <button class="tweet-button"> Tweet </button> 
  </div>

  <div class="mutual-box">
    <div class="picture-boxy">
    <img class="pfp-pic" src="pics/download.jpg">
  </div>

    <p class="pf-name"> Oliver </p>
    <div class="mutpic"> 
      <img class="catmut" src="pics/cat.jpg"> 
    </div>
    <p class="mt-friends"> 2 mutual friends </p>
    <button class="add-f"> Add Friend </button>
  </div>

  </div>

  <div class="mutual-bo">

      <img class="catmut" src="pics/cat.jpg"> 
    </div>

  </div>

  </div>

  <div class="mutual-b">
